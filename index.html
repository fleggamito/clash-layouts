<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Layouts - Clash of Clans</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
    h1 { color: #ffcc00; }
    .container { max-width: 800px; margin: 0 auto; }
    select, button { padding: 10px 15px; font-size: 16px; margin: 10px; border-radius: 5px; border: none; }
    button { background: #ffcc00; color: #000; font-weight: bold; cursor: pointer; }
    button:hover { background: #e6b800; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: #2a2a2a; border-radius: 8px; padding: 15px; text-align: left; border: 1px solid #444; }
    .card img { width: 100%; border-radius: 5px; }
    .card h3 { font-size: 14px; margin: 10px 0; height: 40px; overflow: hidden; }
    .btn-link { display: block; background: #4CAF50; color: white; text-align: center; padding: 8px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Buscador de Layouts Clash of Clans</h1>
    <p>Selecione seu Centro de Vila para encontrar layouts recentes:</p>
    
    <label for="cv">Centro de Vila:</label>
    <select id="cv">
      <option value="18">CV 18 (TH18)</option>
      <option value="17">CV 17 (TH17)</option>
      <option value="16">CV 16 (TH16)</option>
      <option value="15">CV 15 (TH15)</option>
      <option value="14">CV 14 (TH14)</option>
      <option value="13">CV 13 (TH13)</option>
    </select>

    <button onclick="buscarLayouts()">Buscar Layouts</button>

    <div id="status"></div>
    <div id="resultados" class="grid"></div>
  </div>

  <script>
    async function buscarLayouts() {
      const cv = document.getElementById('cv').value;
      const status = document.getElementById('status');
      const resultados = document.getElementById('resultados');

      status.innerText = 'Buscando vídeos e layouts no YouTube...';
      resultados.innerHTML = '';

      try {
        const res = await fetch(`/api/buscar?cv=${cv}`);
        const dados = await res.json();

        status.innerText = '';

        if (!dados.success || dados.data.length === 0) {
          status.innerText = 'Nenhum layout com link direto encontrado nas descrições recentes.';
          return;
        }

        dados.data.forEach(item => {
          resultados.innerHTML += `
            <div class="card">
              <img src="${item.thumbnail}" alt="Thumbnail">
              <h3>${item.titulo}</h3>
              <a href="${item.videoUrl}" target="_blank" style="color:#aaa; font-size:12px;">Assistir Vídeo</a>
              <a href="${item.layoutLink}" target="_blank" class="btn-link">Copiar Layout</a>
            </div>
          `;
        });
      } catch (err) {
        status.innerText = 'Erro ao buscar layouts. Tente novamente.';
      }
    }
  </script>
</body>
</html>
