<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Layouts - Clash of Clans</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #e1e1e6; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #ffcc00; font-size: 2rem; margin-bottom: 10px; }
    p { color: #a8a8b3; }
    
    .search-box { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    select, button { padding: 12px 16px; font-size: 15px; border-radius: 8px; border: none; outline: none; }
    select { background: #202024; color: #fff; border: 1px solid #323238; cursor: pointer; }
    button { background: #ffcc00; color: #121214; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e6b800; transform: translateY(-2px); }

    #status { text-align: center; margin-top: 20px; font-weight: 500; color: #ffcc00; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 25px; }
    .card { background: #202024; border-radius: 12px; border: 1px solid #323238; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .card:hover { border-color: #ffcc00; }
    .thumb-wrapper { position: relative; width: 100%; height: 180px; overflow: hidden; background: #000; }
    .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #ffcc00; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    
    .pub-date { font-size: 12px; color: #8d8d99; margin-top: 8px; font-weight: 500; }

    .card-content { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { font-size: 15px; color: #f7f7f8; margin-top: 6px; margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-video { display: inline-block; color: #a8a8b3; font-size: 13px; text-decoration: none; margin-bottom: 15px; }
    .btn-video:hover { color: #ffcc00; text-decoration: underline; }

    .links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
    .links-grid::-webkit-scrollbar { width: 4px; }
    .links-grid::-webkit-scrollbar-thumb { background: #4d4d57; border-radius: 4px; }
    
    .btn-link { display: block; background: #04d361; color: #0e0e10; text-align: center; padding: 10px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 12px; transition: 0.2s; }
    .btn-link:hover { background: #00b352; }

    /* Estilos de Paginação e Filtro de Ordenação */
    .controls-bar { display: none; justify-content: space-between; align-items: center; margin-top: 20px; flex-wrap: wrap; gap: 10px; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 30px; flex-wrap: wrap; }
    .page-btn { background: #202024; color: #fff; border: 1px solid #323238; padding: 8px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; }
    .page-btn.active { background: #ffcc00; color: #121214; font-weight: bold; border-color: #ffcc00; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Buscador de Layouts</h1>
      <p>Encontre os layouts mais recentes postados no YouTube nos últimos 30 dias</p>
      
      <div class="search-box">
        <select id="cv">
          <option value="" selected disabled>Selecione o Centro de Vila...</option>
          <option value="18">CV 18 (TH18)</option>
          <option value="17">CV 17 (TH17)</option>
          <option value="16">CV 16 (TH16)</option>
          <option value="15">CV 15 (TH15)</option>
          <option value="14">CV 14 (TH14)</option>
          <option value="13">CV 13 (TH13)</option>
          <option value="12">CV 12 (TH12)</option>
          <option value="11">CV 11 (TH11)</option>
          <option value="10">CV 10 (TH10)</option>
        </select>

        <button onclick="buscarLayouts()">Buscar Layouts</button>
      </div>
    </header>

    <div id="controlsBar" class="controls-bar">
      <span id="totalInfo" style="color: #a8a8b3; font-size: 14px;"></span>
      <div>
        <label for="ordem" style="font-size: 14px; margin-right: 6px;">Ordenar por:</label>
        <select id="ordem" onchange="alterarOrdenacao()">
          <option value="recente">Mais Recentes Primeiro</option>
          <option value="antigo">Mais Antigos Primeiro</option>
        </select>
      </div>
    </div>

    <div id="status"></div>
    <div id="resultados" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <script>
    let todosResultados = [];
    let paginaAtual = 1;
    const itensPorPagina = 9;

    async function buscarLayouts() {
      const cv = document.getElementById('cv').value;
      const status = document.getElementById('status');
      const resultados = document.getElementById('resultados');
      const controlsBar = document.getElementById('controlsBar');
      const pagination = document.getElementById('pagination');

      if (!cv) {
        status.innerText = 'Por favor, selecione um Centro de Vila antes de buscar.';
        return;
      }

      status.innerText = 'Buscando vídeos e extraindo layouts...';
      resultados.innerHTML = '';
      pagination.innerHTML = '';
      controlsBar.style.display = 'none';

      try {
        const res = await fetch(`/api/buscar?cv=${cv}`);
        const dados = await res.json();

        status.innerText = '';

        if (!dados.success || !dados.data || dados.data.length === 0) {
          status.innerText = 'Nenhum layout recente encontrado para este Centro de Vila nos últimos 30 dias.';
          return;
        }

        todosResultados = dados.data;
        paginaAtual = 1;
        document.getElementById('ordem').value = 'recente';
        
        controlsBar.style.display = 'flex';
        renderizarPagina();
      } catch (err) {
        status.innerText = 'Erro ao buscar layouts. Tente novamente.';
      }
    }

    function alterarOrdenacao() {
      const ordem = document.getElementById('ordem').value;
      if (ordem === 'recente') {
        todosResultados.sort((a, b) => new Date(b.publicadoEm) - new Date(a.publicadoEm));
      } else {
        todosResultados.sort((a, b) => new Date(a.publicadoEm) - new Date(b.publicadoEm));
      }
      paginaAtual = 1;
      renderizarPagina();
    }

    function renderizarPagina() {
      const resultados = document.getElementById('resultados');
      const pagination = document.getElementById('pagination');
      const totalInfo = document.getElementById('totalInfo');

      resultados.innerHTML = '';
      pagination.innerHTML = '';

      const totalItens = todosResultados.length;
      const totalPaginas = Math.ceil(totalItens / itensPorPagina);

      totalInfo.innerText = `Exibindo ${totalItens} layout(s) encontrado(s)`;

      const inicio = (paginaAtual - 1) * itensPorPagina;
      const fim = inicio + itensPorPagina;
      const itensPagina = todosResultados.slice(inicio, fim);

      itensPagina.forEach(item => {
        let botoesHtml = '';
        item.layoutLinks.forEach((link, idx) => {
          botoesHtml += `<a href="${link}" target="_blank" class="btn-link">Base ${idx + 1}</a>`;
        });

        const dataObj = new Date(item.publicadoEm);
        const dataFormatada = dataObj.toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });

        resultados.innerHTML += `
          <div class="card">
            <div>
              <div class="thumb-wrapper">
                <img src="${item.thumbnail}" alt="Thumbnail">
                <span class="badge">${item.layoutLinks.length} ${item.layoutLinks.length > 1 ? 'Bases' : 'Base'}</span>
              </div>
              <div class="card-content">
                <div>
                  <div class="pub-date">📅 Publicado em: ${dataFormatada}</div>
                  <h3>${item.titulo}</h3>
                  <a href="${item.videoUrl}" target="_blank" class="btn-video">▶ Assistir no YouTube</a>
                </div>
                <div class="links-grid">
                  ${botoesHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      });

      // Renderiza botões de paginação se houver mais de uma página
      if (totalPaginas > 1) {
        let paginacaoHtml = `<button class="page-btn" ${paginaAtual === 1 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual - 1})">Anterior</button>`;

        for (let i = 1; i <= totalPaginas; i++) {
          paginacaoHtml += `<button class="page-btn ${i === paginaAtual ? 'active' : ''}" onclick="mudarPagina(${i})">${i}</button>`;
        }

        paginacaoHtml += `<button class="page-btn" ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual + 1})">Próximo</button>`;
        
        pagination.innerHTML = paginacaoHtml;
      }
    }

    function mudarPagina(novaPagina) {
      paginaAtual = novaPagina;
      renderizarPagina();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
